name: Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install PyYAML

      - name: Build static site
        run: make site

      - name: Publish to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git worktree add /tmp/gh-pages origin/gh-pages
          find /tmp/gh-pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a generated-site/. /tmp/gh-pages/
          git -C /tmp/gh-pages add -A
          if git -C /tmp/gh-pages diff --cached --quiet; then
            echo "No generated site changes to deploy."
            exit 0
          fi
          git -C /tmp/gh-pages commit -m "Deploy static site"
          git -C /tmp/gh-pages push origin HEAD:gh-pages
