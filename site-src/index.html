<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vaccine schedule for Bulgaria</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="page-header">
      <div class="header-content">
        <div class="header-title-row">
          <h1 id="page-title">Vaccine schedule for Bulgaria</h1>
          <div class="header-actions">
            <button id="bg-toggle" class="language-toggle" type="button" aria-pressed="false">BG</button>
            <button id="details-toggle" class="language-toggle header-text-toggle" type="button" aria-pressed="false">Details</button>
          </div>
        </div>
        <nav id="page-nav" class="grouped-page-nav" aria-label="Pages and sheets"></nav>
      </div>
    </header>

    <main>
      <section id="schedule-page" class="table-section" aria-label="Schedule">
        <div id="table-source" class="table-source"></div>
        <div class="table-scroll">
          <table id="schedule-table">
            <caption>Vaccines by time point</caption>
          </table>
        </div>
      </section>

      <section id="sheet-page" hidden>
        <div id="sheet-source" class="table-source"></div>
        <section id="change-notes-list" class="change-notes-list" aria-label="Change notes" hidden></section>
        <section id="sheet-table-section" class="table-section" aria-label="Source sheet">
          <div class="table-scroll sheet-scroll">
            <table id="his-sheet-table" class="his-sheet-table" hidden></table>
            <table id="ncpr-sheet-table" class="his-sheet-table ncpr-sheet-table" hidden></table>
            <table id="bda-sheet-table" class="his-sheet-table bda-sheet-table" hidden></table>
            <table id="ema-sheet-table" class="his-sheet-table ema-sheet-table" hidden></table>
          </div>
        </section>
        <section id="sheet-footnotes" class="sheet-footnotes" aria-label="Footnotes" hidden></section>
        <span id="sheet-caption" hidden></span>
      </section>

      <section class="sources-section" aria-label="Reference links">
        <div class="link-row">
          <h2 id="sources-title">Bulgarian sources:</h2>
          <ul id="source-list"></ul>
        </div>
        <div class="link-row">
          <h2>Registries:</h2>
          <ul>
            <li><a href="https://atcddd.fhi.no/atc_ddd_index/" rel="noreferrer">ATC/DDD</a></li>
            <li>BDA (<a href="https://bda.bg/bg/%D1%80%D0%B5%D0%B3%D0%B8%D1%81%D1%82%D1%80%D0%B8/%D0%BA%D1%80%D0%B0%D1%82%D0%BA%D0%B8-%D1%85%D0%B0%D1%80%D0%B0%D0%BA%D1%82%D0%B5%D1%80%D0%B8%D1%81%D1%82%D0%B8%D0%BA%D0%B8-%D0%BD%D0%B0-%D0%BF%D1%80%D0%BE%D0%B4%D1%83%D0%BA%D1%82%D0%B8%D1%82%D0%B5" rel="noreferrer">1</a>,<a href="https://bda.bg/bg/%D1%80%D0%B5%D0%B3%D0%B8%D1%81%D1%82%D1%80%D0%B8/%D0%BB%D0%B8%D1%81%D1%82%D0%BE%D0%B2%D0%BA%D0%B8-%D0%B7%D0%B0-%D0%BF%D0%B0%D1%86%D0%B8%D0%B5%D0%BD%D1%82%D0%B0" rel="noreferrer">2</a>)</li>
            <li><a href="https://www.ncpr.bg/bg/%D1%80%D0%B5%D0%B3%D0%B8%D1%81%D1%82%D1%80%D0%B8.html" rel="noreferrer">NCPR</a></li>
            <li><a href="https://www.ema.europa.eu/en/medicines" rel="noreferrer">EMA</a></li>
            <li><a href="https://extranet.who.int/prequal/vaccines" rel="noreferrer">WHO PQ</a></li>
          </ul>
        </div>
        <div class="link-row">
          <h2>Other calendars:</h2>
          <ul id="other-calendar-list"></ul>
        </div>
      </section>
    </main>

    <script src="schedule-table.js"></script>
    <script src="his-sheets.js"></script>
    <script src="ncpr-sheets.js"></script>
    <script src="bda-sheets.js"></script>
    <script src="ema-sheets.js"></script>
    <script src="site-route.js"></script>
    <script src="page-nav.js"></script>
    <script src="app.js"></script>
    <script src="his-sheet.js"></script>
    <script src="ncpr-sheet.js"></script>
    <script src="bda-sheet.js"></script>
    <script src="ema-sheet.js"></script>
  </body>
</html>
