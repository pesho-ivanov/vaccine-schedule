  - diseases:
      - flu
      - грип
      - influenza
    column: Pregnancy
    occurrence: 1
  - diseases:
      - rsv
    column: Pregnancy
    occurrence: 3
default_pre_birth_record_column:
  column: Pregnancy
  occurrence: 2

cell_additions:
  - row: tuberculosis
    cells:
      - column: 7m
        text: BCG
        note: >-
          Only after negative Montoux test. Проверка за белег след БЦЖ
          имунизацията. На децата без белег се прави проба манту.
          Отрицателните се имунизират с БЦЖ ваксина.
      - column: 7y
        text: BCG
        note: >-
          Only after negative Montoux test. Проверка за белег след БЦЖ
          имунизацията. На децата без белег се прави проба манту.
          Отрицателните се имунизират с БЦЖ ваксина.

  - row: COVID
    cells:
      - column: 25y
        through: 59y
        text: COVID
        note: >-
          Priority groups: people aged 60+, people with chronic diseases,
          immunocompromised people, pregnant women, medical staff, and users
          and staff of social institutions.
      - column: 60y
        through: ≥65y
        text: COVID
        note: >-
          Priority groups: people aged 60+, people with chronic diseases,
          immunocompromised people, pregnant women, medical staff, and users
          and staff of social institutions.

  - row: diphtheria
    cells:
      - column: 25y
        through: ≥65y
        text: d
        note: Subsequent Td booster every 10 years.

  - row: tetanus
    cells:
      - column: 25y
        through: ≥65y
        text: TT
        note: Subsequent Td booster every 10 years.

  - row: pertussis
    cells:
      - column: 18y
        through: 64y
        text: acp
        note: >-
          Immunization against pertussis is given to pregnant women between
          the 27th and 36th weeks of pregnancy.

  - row: pneumococcal disease
    cells:
      - column: ≥65y
        text: PCV13
        note: >-
          For people over 65 years of age, influenza and pneumococcal vaccines
          and administration are free of charge and funded according to the
          National programme.

  - row: influenza
    cells:
      - column: Pregnancy
        text: IIV3/IIV4
      - column: 18y
        through: 64y
        text: IIV3/IIV4
        note: >-
          Inactivated vaccines are recommended for all people over 18 years of age.
          Vaccines are not funded but vaccine administration is funded by the
          national health insurance only for insured people.
      - column: ≥65y
        text: IIV3/IIV4
        note: >-
          For people over 65 years of age, influenza and pneumococcal vaccines
          and administration are free of charge and funded according to the
          National programme.

insert_rows:
  - where: first_recommended
    label: RSV
    label_title: респираторно-синцитиален вирус
    cells:
      - column: Pregnancy
        occurrence: 3
        text: RSV $
        muted: true
      - column: 18y
        through: ≥65y
        text: RSV
        note: >-
          Recommended for people aged 18 years and older.
          Препоръчва се за лица на възраст 18 години и повече.

  - where: first_recommended
    label: Pert
    label_title: коклюш
    cells:
      - column: Pregnancy
        occurrence: 2
        text: DPT

  - where: after
    after: rotavirus
    label: Meningococcal
    cells:
      - column: 2m
        span: 18
        text: "MCV4\nMenB"
        note: >-
          General recommendation: MCV4 between 6 weeks and 18 years.
          General recommendation: MenB between 2 months and 18 years.

  - where: after
    after: Meningococcal
    label: hepatitis A
    label_title: вирусен хепатит тип А
    cells:
      - column: 12m
        span: 13
        text: HepA

move_rows_to_end:
  - HPV

hpv_split:
  row: HPV
  source_text: HPV9 (F/M)
  first_female_only_column: 14y
  female_only_end_column: 18y
  female_only_text: HPV9 (F)
  female_only_note_style: true

overlay_fills:
  - row: HPV
    cell_text: HPV9 (F/M)
    fill_background: linear-gradient(90deg, #ffffff 0 50%, #94a3b8 50% 100%)
  - row: HPV
    cell_text: HPV9 (F)
    fill_background: linear-gradient(90deg, #ffffff 0 33.333%, #94a3b8 33.333% 66.667%, #ffffff 66.667% 100%)
