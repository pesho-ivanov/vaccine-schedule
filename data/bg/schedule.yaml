- vaccine: hepatitis_b
  group: mandatory
  doses:
  - column: birth
    text: HepB
    note: Hepatitis B During the first 24 hours after birth with a monovalent hepatitis B
      vaccine, regardless of the type of vaccine used to continue the immunization schedule.
  - column: 1m
    text: HepB
    note: Hepatitis B When using a monovalent vaccine, doses are administered at 1 and 6 months
  - column: 2m
    text: HepB
    note: Hepatitis B When administering a combination vaccine containing a hepatitis B vaccine,
      doses are given at 2, 3 and 4 months of age.
  - column: 3m
    text: HepB
    note: Hepatitis B When administering a combination vaccine containing a hepatitis B vaccine,
      doses are given at 2, 3 and 4 months of age.
  - column: 4m
    text: HepB
    note: Hepatitis B When administering a combination vaccine containing a hepatitis B vaccine,
      doses are given at 2, 3 and 4 months of age.
  - column: 6m
    text: HepB
    note: Hepatitis B When using a monovalent vaccine, doses are administered at 1 and 6 months
- vaccine: pneumococcal_disease
  group: mandatory
  doses:
  - column: 2m
    text: PCV
    note: Pneumococcal conjugate vaccine Routine vaccination begins at 6 weeks of age. Second
      dose is given at 14 weeks of age. For children born to mothers vaccinated against pertussis
      during pregnancy, mandatory immunization against pneumococcal infections is carried
      out from two months of age. Subsequent immunization is administered no earlier than
      8 weeks after the first dose, respectively from four months of age.
  - column: 4m
    text: PCV
    note: Pneumococcal conjugate vaccine Routine vaccination begins at 6 weeks of age. Second
      dose is given at 14 weeks of age. For children born to mothers vaccinated against pertussis
      during pregnancy, mandatory immunization against pneumococcal infections is carried
      out from two months of age. Subsequent immunization is administered no earlier than
      8 weeks after the first dose, respectively from four months of age.
  - column: 12m
    text: PCV
    note: Pneumococcal conjugate vaccine Not earlier than 6 months after the previous dose.
  - column: gte65y
    text: PCV13
    note: For people over 65 years of age, influenza and pneumococcal vaccines and administration
      are free of charge and funded according to the National programme.
