      tetanus, pertussis, poliomyelitis, Haemophilus influenzae type B infections, and viral hepatitis
      type B is carried out from two months of age. Subsequent immunizations are administered no earlier
      than 4 weeks after the previous dose, at three and four months of age, respectively.
  - column: 3m
    note: acellular pertussis vaccine, pediatric formulation
  - column: 4m
    note: acellular pertussis vaccine, pediatric formulation
  - column: 16m
    note: acellular pertussis vaccine, pediatric formulation Not earlier than 12 months after the 3rd
      dose
  - column: 6y
    note: acellular pertussis vaccine, pediatric formulation
  - column: 12y
    note: acellular pertussis vaccine, adult/adolescent formulation
  - column: 18y
    through: 64y
    note: acellular pertussis vaccine, adult/adolescent formulation Immunization against pertussis is
      given to pregnant women between the 27th and 36th weeks of pregnancy. A booster of TDaP reduced-antigen
      vaccine and the administration are free of charge for pregnant women and  funded by the National
      Health system.
