version: 1
country: BG
notes:
- disease: tuberculosis
  doses:
  - column: birth
    note: Bacille Calmette-Guerin vaccine Administration after 48 hours from birth.
  - column: 7m
    note: Only after negative Montoux test. Проверка за белег след БЦЖ имунизацията. На децата без белег
      се прави проба манту. Отрицателните се имунизират с БЦЖ ваксина.
  - column: 7y
    note: Only after negative Montoux test. Проверка за белег след БЦЖ имунизацията. На децата без белег
      се прави проба манту. Отрицателните се имунизират с БЦЖ ваксина.
- disease: diphtheria
  doses:
  - column: 2m
    note: Diphtheria toxoid, paediatric formulation Routine vaccination against diphtheria, tetanus, pertussis,
      poliomyelitis, Haemophilus influenzae type B infections, and viral hepatitis type B vaccination
      begins at 6 weeks of age. Second and third doses are given at week 10 and week 14. For children
      born to mothers vaccinated during pregnancy against pertussis, mandatory immunization against diphtheria,
      tetanus, pertussis, poliomyelitis, Haemophilus influenzae type B infections, and viral hepatitis
      type B is carried out from two months of age. Subsequent immunizations are administered no earlier
      than 4 weeks after the previous dose, at three and four months of age, respectively. For children
      born to mothers vaccinated during pregnancy against pertussis, mandatory immunization against diphtheria,
      tetanus, pertussis, poliomyelitis, Haemophilus influenzae type B infections, and viral hepatitis
      type B is carried out from two months of age. Subsequent immunizations are administered no earlier
      than 4 weeks after the previous dose, at three and four months of age, respectively.
  - column: 3m
    note: Diphtheria toxoid, paediatric formulation
  - column: 4m
    note: Diphtheria toxoid, paediatric formulation
  - column: 16m
    note: Diphtheria toxoid, paediatric formulation Not earlier than 12 months after the 3rd dose
  - column: 6y
    note: Diphtheria toxoid, paediatric formulation
  - column: 12y
    note: diphtheria toxoid, reduced antigen content
  - column: 17y
    note: diphtheria toxoid, reduced antigen content
  - column: 25y
    through: gte65y
    note: Subsequent Td booster every 10 years.
- disease: tetanus
