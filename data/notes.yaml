      at three and four months of age, respectively. For children born to mothers vaccinated during pregnancy
      against pertussis, mandatory immunization against diphtheria, tetanus, pertussis, poliomyelitis,
      Haemophilus influenzae type B infections, and viral hepatitis type B is carried out from two months
      of age. Subsequent immunizations are administered no earlier than 4 weeks after the previous dose,
      at three and four months of age, respectively.
  - column: 3m
    note: Tetanus toxoid
  - column: 4m
    note: Tetanus toxoid
  - column: 16m
    note: Tetanus toxoid Not earlier than 12 months after the 3rd dose
  - column: 6y
    note: Tetanus toxoid
  - column: 12y
    note: Tetanus toxoid
  - column: 17y
    note: Tetanus toxoid
  - column: 25y
    through: gte65y
    note: Subsequent Td booster every 10 years.
- disease: pertussis
