  - column: 4m
    note: poliovirus vaccine, types 1, 2, 3, inactivated
  - column: 16m
    note: poliovirus vaccine, types 1, 2, 3, inactivated Not earlier than 12 months after the 3rd dose
  - column: 6y
    note: poliovirus vaccine, types 1, 2, 3, inactivated
