<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HIS nomenclature sheet</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="sheet-page">
    <header class="page-header">
      <div class="header-content">
        <h1><a class="title-link" href="index.html">Vaccine schedule for Bulgaria</a></h1>
        <nav class="page-link-row sheet-link-row" aria-label="Pages and HIS sheets">
          <a href="index.html">Table</a>
          <ul id="sheet-nav"></ul>
        </nav>
      </div>
      <div class="header-actions">
        <button id="bg-toggle" class="language-toggle" type="button" aria-pressed="false">BG</button>
        <button id="old-records-toggle" class="language-toggle old-records-toggle" type="button" aria-pressed="false">Old records</button>
        <button id="details-toggle" class="language-toggle old-records-toggle" type="button" aria-pressed="false">Details</button>
      </div>
    </header>

    <main>
      <div id="sheet-source" class="table-source"></div>
      <section id="change-notes-list" class="change-notes-list" aria-label="Change notes" hidden></section>
      <section id="sheet-table-section" class="table-section" aria-label="HIS sheet">
        <div class="table-scroll sheet-scroll">
          <table id="his-sheet-table" class="his-sheet-table">
            <caption id="sheet-caption">HIS nomenclature sheet</caption>
          </table>
        </div>
      </section>
      <section id="sheet-footnotes" class="sheet-footnotes" aria-label="Footnotes" hidden></section>
      <section class="sources-section" aria-label="Reference links">
        <div class="link-row">
          <h2>Bulgarian sources:</h2>
          <ul id="source-list"></ul>
        </div>
        <div class="link-row">
          <h2>Other calendars:</h2>
          <ul id="other-calendar-list"></ul>
        </div>
        <div class="link-row">
          <h2>Registries:</h2>
          <ul>
            <li><a href="https://atcddd.fhi.no/atc_ddd_index/" rel="noreferrer">ATC/DDD</a></li>
            <li><a href="https://bda.bg/bg/%D1%80%D0%B5%D0%B3%D0%B8%D1%81%D1%82%D1%80%D0%B8/%D0%BA%D1%80%D0%B0%D1%82%D0%BA%D0%B8-%D1%85%D0%B0%D1%80%D0%B0%D0%BA%D1%82%D0%B5%D1%80%D0%B8%D1%81%D1%82%D0%B8%D0%BA%D0%B8-%D0%BD%D0%B0-%D0%BF%D1%80%D0%BE%D0%B4%D1%83%D0%BA%D1%82%D0%B8%D1%82%D0%B5" rel="noreferrer">BDA SmPC</a></li>
            <li><a href="https://bda.bg/bg/%D1%80%D0%B5%D0%B3%D0%B8%D1%81%D1%82%D1%80%D0%B8/%D0%BB%D0%B8%D1%81%D1%82%D0%BE%D0%B2%D0%BA%D0%B8-%D0%B7%D0%B0-%D0%BF%D0%B0%D1%86%D0%B8%D0%B5%D0%BD%D1%82%D0%B0" rel="noreferrer">BDA patient leaflets</a></li>
            <li><a href="https://www.ema.europa.eu/en/medicines" rel="noreferrer">EMA</a></li>
            <li><a href="https://extranet.who.int/prequal/vaccines" rel="noreferrer">WHO PQ</a></li>
          </ul>
        </div>
      </section>
    </main>

    <script src="his-sheets.js"></script>
    <script src="his-sheet.js"></script>
  </body>
</html>
